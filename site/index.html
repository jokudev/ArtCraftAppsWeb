<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ArtCraft Web Apps</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #10131b; color: #f5f7ff; font: 16px/1.5 system-ui, sans-serif; }
      main { width: min(680px, calc(100% - 40px)); }
      h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: 0 0 8px; }
      p { color: #aeb7c9; margin: 0 0 28px; }
      ul { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; list-style: none; margin: 0; padding: 0; }
      a { display: block; padding: 18px 20px; border: 1px solid #343b4c; border-radius: 12px; color: inherit; text-decoration: none; background: #191e2a; }
      a:hover, a:focus-visible { border-color: #8aa2ff; background: #20283a; }
      .app-link { display: flex; align-items: center; gap: 12px; }
      .app-link img { width: 24px; height: 24px; border-radius: 5px; flex: 0 0 auto; }
    </style>
  </head>
  <body>
    <main>
      <h1>ArtCraft Web Apps</h1>
      <p>Choose an app to open.</p>
      <ul>
        <li><a class="app-link" href="/photocraft/"><img alt="" src="https://raw.githubusercontent.com/storytold/photocraft/main/assets/app-icon/hicolor/64x64/apps/ai.storyteller.photocraft.png"><span>PhotoCraft</span></a></li>
        <li><a class="app-link" href="/vectorcraft/"><img alt="" src="https://raw.githubusercontent.com/storytold/vectorcraft/main/assets/app-icon/hicolor/64x64/apps/ai.storyteller.vectorcraft.png"><span>VectorCraft</span></a></li>
        <li><a class="app-link" href="/filmcraft/"><img alt="" src="https://raw.githubusercontent.com/storytold/filmcraft/main/assets/app-icon/hicolor/64x64/apps/ai.storyteller.filmcraft.png"><span>FilmCraft</span></a></li>
        <li><a class="app-link" href="/lightcraft/"><img alt="" src="https://raw.githubusercontent.com/storytold/lightcraft/main/assets/app-icon/hicolor/64x64/apps/ai.storyteller.lightcraft.png"><span>LightCraft</span></a></li>
        <li><a class="app-link" href="/pdfcraft/"><img alt="" src="https://raw.githubusercontent.com/storytold/pdfcraft/main/assets/app-icon/hicolor/64x64/apps/ai.storyteller.pdfcraft.png"><span>PdfCraft</span></a></li>
        <li><a class="app-link" href="/effectcraft/"><img alt="" src="https://raw.githubusercontent.com/storytold/effectcraft/main/assets/app-icon/hicolor/64x64/apps/ai.storyteller.effectcraft.png"><span>EffectCraft</span></a></li>
        <li><a class="app-link" href="/designcraft/"><img alt="" src="https://raw.githubusercontent.com/storytold/designcraft/main/assets/app-icon/hicolor/64x64/apps/ai.storyteller.designcraft.png"><span>DesignCraft</span></a></li>
        <li><a class="app-link" href="/gridcraft/"><img alt="" src="https://raw.githubusercontent.com/storytold/gridcraft/main/assets/app-icon/hicolor/64x64/apps/ai.storyteller.gridcraft.png"><span>GridCraft</span></a></li>
        <li><a class="app-link" href="/wordcraft/"><img alt="" src="https://raw.githubusercontent.com/storytold/wordcraft/main/assets/app-icon/hicolor/64x64/apps/ai.storyteller.wordcraft.png"><span>WordCraft</span></a></li>
        <li><a class="app-link" href="/deckcraft/"><img alt="" src="https://raw.githubusercontent.com/storytold/deckcraft/main/assets/app-icon/hicolor/64x64/apps/ai.storyteller.deckcraft.png"><span>DeckCraft</span></a></li>
        <li><a class="app-link" href="/cadcraft/"><img alt="" src="https://raw.githubusercontent.com/storytold/cadcraft/main/assets/app-icon/hicolor/64x64/apps/ai.storyteller.cadcraft.png"><span>CADCraft</span></a></li>
        <li><a class="app-link" href="/soundcraft/"><img alt="" src="https://raw.githubusercontent.com/storytold/soundcraft/main/assets/app-icon/hicolor/64x64/apps/ai.storyteller.soundcraft.png"><span>SoundCraft</span></a></li>
        <li><a class="app-link" href="/figcraft/"><img alt="" src="https://raw.githubusercontent.com/storytold/figcraft/main/assets/app-icon/hicolor/64x64/apps/ai.storyteller.figcraft.png"><span>FigCraft</span></a></li>
      </ul>
    </main>
  </body>
</html>
