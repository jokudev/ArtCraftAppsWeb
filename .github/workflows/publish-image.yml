name: Build and publish web image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Install Rust and the WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Check out upstream app sources
        run: |
          mkdir -p apps
          for app in wordcraft deckcraft gridcraft pdfcraft; do
            git clone --depth 1 --branch main "https://github.com/storytold/${app}.git" "apps/${app}"
          done

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/wordcraft -> apps/wordcraft/target
            apps/deckcraft -> apps/deckcraft/target
            apps/gridcraft -> apps/gridcraft/target
            apps/pdfcraft -> apps/pdfcraft/target

      - name: Install Trunk
        run: cargo install trunk --locked

      - name: Update and build all web apps
        run: ./scripts/update-build-web.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jokudev/artcraftappsweb
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
